<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --dark-green: #244419;
            --light-green: #A3B583;
            --tan: #A58062;
            --brown: #5E483A;
            --gray: #9C9BA1;
            --cream: #F5F3F0;
            --warning: #FF9800;
            --success: #4CAF50;
            --danger: #F44336;
            --info: #2196F3;
        }

        @media print {
            @page {
                size: A4;
                margin: 10mm;
            }

            /* Enhanced print header styles */
            header {
                background: linear-gradient(90deg, white 0%, white 45%, #244419 45%, #244419 100%) !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                padding: 10px 15px !important;
            }

            .logo {
                height: 25px !important;
            }

            h1 {
                font-size: 16pt !important;
            }

            .subtitle {
                font-size: 10pt !important;
            }

            /* Ensure sections stay together */
            h2:last-of-type,
            h2:last-of-type + *,
            h2:nth-last-of-type(2) + *,
            h2:nth-last-of-type(2) + * + * {
                page-break-inside: avoid !important;
                page-break-before: avoid !important;
            }
            h2 {
                page-break-after: avoid !important;
                page-break-before: avoid !important;
                break-before: avoid !important;
                break-after: avoid !important;
                min-height: 2em;
                margin-top: 15px !important;
                margin-bottom: 8px !important;
            }

            /* Keep intro paragraphs with headings */
            /* Aggressive page break prevention for h2 sections */
            h2 {
                page-break-before: auto !important;
                page-break-after: avoid !important;
                break-after: avoid !important;
                page-break-inside: avoid !important;
            }

            /* Force h2 and its following content to stay together */
            h2, h2 + *, h2 + * + * {
                page-break-inside: avoid !important;
                break-inside: avoid-page !important;
            }

            /* Wrap sections to prevent breaks */
            .two-column {
                page-break-inside: avoid !important;
                page-break-after: auto !important;
            }

            /* Ensure Troubleshooting section stays together */
            h2:nth-last-of-type(1),
            h2:nth-last-of-type(1) + * {
                page-break-before: avoid !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
            /* Keep any content following h2 headings */
            /* Prevent orphaned headings at page end */
            .two-column + h2,
            .info-card + h2,
            .visual-guide + h2,
            div + h2 {
                page-break-before: avoid !important;
                break-before: avoid !important;
                margin-top: 20px !important;
            }

            /* Keep last element before h2 together if possible */

            h2 + * {
                page-break-before: avoid !important;
                break-before: avoid !important;
            }

            /* Specific rules for common patterns */
            h2 + div,
            h2 + .info-card,
            h2 + .timeline,
            h2 + .two-column,
            h2 + .alert-box,
            h2 + .warning-box,
            h2 + .success-box,
            h2 + table {
                page-break-before: avoid !important;
                break-before: avoid !important;
                margin-top: 8px !important;
            }

            h2 + p {
                page-break-before: avoid !important;
                break-before: avoid !important;
                orphans: 4;
                widows: 4;
            }

            /* Prevent breaking inside important elements */
            .timeline-item,
            .treatment-card,
            .info-card,
            .care-card,
            .alert-box,
            .warning-box,
            .success-box,
            .info-box,
            .timeline,
            .dos-donts,
            .two-column,
            .visual-guide,
            .checklist,
            .schedule-table {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            /* Keep timeline items together */
            .timeline-item:first-child,
            .timeline-item:first-child + .timeline-item {
                page-break-after: avoid;
                break-after: avoid;
            }

            /* Table handling */
            table {
                page-break-inside: auto;
            }

            thead {
                display: table-header-group;
            }

            tr {
                page-break-inside: avoid;
            }

            /* Reduce spacing for print */
            .content {
                padding: 10px !important;
            }

            .warning-box, .info-box, .success-box, .alert-box {
                margin: 10px 0 !important;
                padding: 10px !important;
            }

            /* Force color preservation */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }
        }

        body {
            font-family: 'Lato', sans-serif;
            line-height: 1.4;
            font-size: 11pt;
            color: #333;
        }

        .container {
            max-width: 210mm;
            margin: 0 auto;

        }

        header {

            border-bottom: 2px solid var(--light-green);
        }

        h3 {

            font-size: 12pt;
            margin: 15px 0 8px 0;

        .alert-box {
            background: #F5EDE6; /* Lighter tint of tan */
            border-left: 4px solid var(--warning);
            padding: 12px;
            margin: 15px 0;
            border-radius: 5px;

        .danger-box {
            background: #FFEBEE;
            border-left: 4px solid var(--danger);
            padding: 12px;
            margin: 15px 0;
            border-radius: 5px;
        }

        .success-box {
            background: #E8F2E0; /* Lighter tint of light-green */
            border-left: 4px solid var(--success);
            padding: 12px;
            margin: 15px 0;
            border-radius: 5px;
        }

        .info-box {
            background: var(--cream); /* Brand cream color */
            border-left: 4px solid var(--info);
            padding: 12px;
            margin: 15px 0;
            border-radius: 5px;
        }

        .treatment-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 15px 0;
        }

        .treatment-card {
            background: var(--cream);
            border-radius: 8px;
            padding: 12px;
            border-left: 4px solid var(--dark-green);
        }

        .treatment-card h4 {
            color: var(--dark-green);
            margin-bottom: 8px;
        }

        .pest-type {
            display: grid;
            grid-template-columns: 80px 1fr 1fr;
            gap: 10px;
            align-items: start;
            padding: 10px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .pest-icon {
            background: var(--danger);
            color: white;
            padding: 5px;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
            font-size: 10pt;
        }

        .disease-icon {
            background: var(--warning);
        }

        .timeline {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            padding: 15px;
            background: linear-gradient(90deg, var(--cream) 0%, white 100%);
            border-radius: 8px;
        }

        .timeline-item {
            text-align: center;
            flex: 1;
        }

        .timeline-day {
            background: var(--dark-green);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 10pt;
        }

        .safety-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 15px 0;
        }

        .safety-card {
            background: white;
            border: 2px solid var(--warning);
            border-radius: 6px;
            padding: 10px;
            text-align: center;
        }

        .safety-icon {

            margin-bottom: 5px;
        }

        ul {

            margin: 5px 0;
        }

        li {

        }

        .two-column {

            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 15px 0;
        }

        .identification-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            font-size: 10pt;
        }

        .identification-table th {
            background: var(--dark-green);
            color: white;
            padding: 8px;
            text-align: left;
        }

        .identification-table td {
            padding: 8px;
            border-bottom: 1px solid #e0e0e0;
        }

        .identification-table tr:nth-child(even) {
            background: var(--cream);

        .contact-bar {

            padding: 10px 20px;
            text-align: center;
            margin-top: 20px;
            border-radius: 8px;

            padding: 10px 20px;
            text-align: center;
            font-size: 9pt;
            margin-top: 20px;
            border-bottom-left-radius: 20px;
        }
    </style>
</head>
