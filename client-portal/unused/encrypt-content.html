<!DOCTYPE html>
<html>
<head>
    <title>Content Encryptor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <h1>Content Encryptor</h1>
    <p>Open console to see encrypted output</p>

    <script>
        // This is the SECRET_KEY from login.html
        const SECRET_KEY = 'PRIVIUM_GARDEN_SERVICES_2025_SECRET_KEY_v1';

        // Example: encrypt for a test user
        const testEmail = 'test@example.com';
        const testToken = 'PRIV-' + CryptoJS.SHA256(testEmail + SECRET_KEY).toString().substring(0, 16).toUpperCase();

        // Generate decryption key (same as login.html)
        const decryptionKey = CryptoJS.SHA256(testEmail + testToken + SECRET_KEY).toString();

        console.log('Test Email:', testEmail);
        console.log('Test Token:', testToken);
        console.log('Decryption Key:', decryptionKey);

        // Test content
        const testContent = '<h1>Test Content</h1><p>This is protected content.</p>';

        // Encrypt
        const encrypted = CryptoJS.AES.encrypt(testContent, decryptionKey).toString();
        console.log('Encrypted:', encrypted);

        // Decrypt
        const decrypted = CryptoJS.AES.decrypt(encrypted, decryptionKey).toString(CryptoJS.enc.Utf8);
        console.log('Decrypted:', decrypted);
    </script>
</body>
</html>
